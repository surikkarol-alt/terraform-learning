name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  terraform-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  terraform-validate:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment:
          - dev
          - prod

    defaults:
      run:
        working-directory: lesson-09-environments/environments/${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  terraform-plan-dev:
    runs-on: ubuntu-latest
    needs:
      - terraform-format
      - terraform-validate

    defaults:
      run:
        working-directory: lesson-09-environments/environments/dev

    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_environment: dev
      TF_VAR_ssh_public_key_path: /tmp/id_rsa.pub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure OCI credentials
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" > /tmp/oci_api_key.pem
          chmod 600 /tmp/oci_api_key.pem

          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=/tmp/oci_api_key.pem
          EOF

          chmod 600 ~/.oci/config

      - name: Configure SSH public key
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" > /tmp/id_rsa.pub
          chmod 600 /tmp/id_rsa.pub

      - name: Check OCI credentials
        shell: bash
        run: |
          test -s ~/.oci/config
          test -s /tmp/oci_api_key.pem

          openssl pkey \
            -in /tmp/oci_api_key.pem \
            -check \
            -noout

          ACTUAL_FP=$(openssl rsa \
            -in /tmp/oci_api_key.pem \
            -pubout \
            -outform DER 2>/dev/null \
            | openssl md5 -c \
            | sed 's/^MD5(stdin)= //')

          if [ "$ACTUAL_FP" != "${{ secrets.OCI_FINGERPRINT }}" ]; then
            echo "ERROR: OCI private key fingerprint does not match OCI_FINGERPRINT"
            exit 1
          fi

          echo "OCI private key is valid"
          echo "OCI fingerprint matches"
          echo "OCI config profile exists"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan DEV
        run: terraform plan -input=false
